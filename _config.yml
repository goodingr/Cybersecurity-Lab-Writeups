title: Cybersecurity Lab Writeups
description: CTF challenge and lab walkthroughs across TryHackMe, Hack The Box, and self-directed security projects.
theme: jekyll-theme-slate

plugins:
  - jekyll-sitemap

defaults:
  - scope:
      path: ""
    values:
      layout: default
  # Writeups get the nav wrapper; the index keeps the plain theme layout.
  - scope:
      path: "Rooms"
    values:
      layout: writeup
  - scope:
      path: "Honeypot"
    values:
      layout: writeup

exclude:
  - LICENSE
  - .gitignore
